<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <title>SomethingType</title>

    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png" />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <link rel="mask-icon" href="./favicon/safari-pinned-tab.svg" color="#5bbad5" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/main.js" type="module"></script>
  </head>
  <body>
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" tabindex="-1">
      <img src="./images/logo4.png" class="logo" id="logo-img" alt="SomethingType logo" />
    </a>
    <button class="menu-button" id="menu-button" type="button">Menu</button>
    <div class="buttonss" id="buttons">
      <button class="s60" data-words="60" type="button">60</button>
      <button class="s30" data-words="30" type="button">30</button>
      <button class="s10" data-words="10" type="button">10</button>
    </div>
    <div class="right-wrong" id="word"></div>
    <div class="container">
      <div id="timer" class="timer">0</div>
      <section class="test-box" id="test">
        <span class="test-box-text" id="test-text"></span>
      </section>
    </div>
    <div class="vertical-menu" id="settingsMenu">
      <div class="active">Menu</div>
      <button id="Romanian" type="button">Language Romanian</button>
      <button id="English" type="button">Language English</button>
    </div>
    <form onsubmit="return false">
      <div id="word-active" class="word_active"></div>
      <input
        autofocus
        autocomplete="off"
        type="text"
        class="write-box"
        id="myInput"
      />
      <input type="button" id="refresh" class="refresh-button" value="Refresh" />

      <section class="score" id="score-screen">
        <p>You Scored:</p>
        <p class="score-wpm" id="wpm"></p>
        <p class="score-acc" id="accuracy"></p>
        <p class="times" id="time"></p>
      </section>
    </form>
  </body>
</html>
